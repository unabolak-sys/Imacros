name: RDP Simpel (.NET & Node.js)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. Install Tailscale
      - name: Install Tailscale
        run: |
          Invoke-WebRequest -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest.exe" -OutFile "$env:TEMP\tailscale-setup.exe"
          Start-Process "$env:TEMP\tailscale-setup.exe" -ArgumentList '/S' -Wait
          Remove-Item "$env:TEMP\tailscale-setup.exe"
          Write-Host "✅ Tailscale installed"

      # 2. Connect Tailscale
      - name: Connect to Tailscale
        env:
          TS_AUTHKEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          & "C:\Program Files\Tailscale\tailscale.exe" up --authkey="$env:TS_AUTHKEY" --accept-routes --accept-dns
          $ip = & "C:\Program Files\Tailscale\tailscale.exe" ip -4
          Write-Host "🌐 Tailscale IPv4: $ip"
          echo "tailscale_ip=$ip" >> $env:GITHUB_OUTPUT
        id: tailscale

      # 3. Setup System (RDP + Firewall + Password + Name)
      - name: Setup System (Fast Mode)
        run: |
          Write-Host "🚀 Mengkonfigurasi Sistem..."
          
          # A. Enable RDP
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0
          
          # B. Matikan Firewall
          Set-NetFirewallProfile -Profile Domain,Public,Private -Enabled False
          
          # C. Set Password
          $password = ConvertTo-SecureString -String "rico" -AsPlainText -Force
          Set-LocalUser -Name "Administrator" -Password $password
          
          # D. Ubah Nama ke richo
          $newName = "richo"
          $env:COMPUTERNAME = $newName
          [Environment]::SetEnvironmentVariable("COMPUTERNAME", $newName, "User")
          
          Write-Host "✅ System Configured (Name: richo)"

      # 4. Install Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 5. Ganti Install .NET dengan Shortcut Virtual Keyboard
      - name: Setup Virtual Keyboard Shortcut
        run: |
          Write-Host "⌨️ Creating Virtual Keyboard Shortcut..."
          $SourceFileLocation = "$env:SystemRoot\System32\osk.exe"
          $ShortcutLocation = "$env:USERPROFILE\Desktop\Virtual Keyboard.lnk"
          $WScriptShell = New-Object -ComObject WScript.Shell
          $Shortcut = $WScriptShell.CreateShortcut($ShortcutLocation)
          $Shortcut.TargetPath = $SourceFileLocation
          $Shortcut.Save()
          
          # Pin ke Taskbar (via Registry/Command seringkali butuh restart, 
          # jadi kita taruh di Public Desktop agar langsung kelihatan)
          Copy-Item $ShortcutLocation -Destination "C:\Users\Public\Desktop\Virtual Keyboard.lnk" -Force
          Write-Host "✅ Virtual Keyboard ready on Desktop"

      # 6. Install Inno Setup
      - name: Install Inno Setup
        run: |
          Write-Host "📦 Menginstal Inno Setup..."
          choco install innosetup -y
          Write-Host "✅ Inno Setup berhasil diinstal"

      # 7. Ready & Keep Alive
      - name: RDP Ready
        run: |
          $ip = "${{ steps.tailscale.outputs.tailscale_ip }}"
          Write-Host "========================================="
          Write-Host "🚀 RDP SIAP (MODE RINGAN)"
          Write-Host "========================================="
          Write-Host "🖥️ Nama Komputer : richo"
          Write-Host "🌐 IP Tailscale  : $ip"
          Write-Host "👤 Username      : Administrator"
          Write-Host "🔑 Password      : rico"
          Write-Host ""
          Write-Host "⚙️ Feature: Node.js Installed"
          Write-Host "⌨️ Feature: Virtual Keyboard Shortcut Created"
          Write-Host "📦 Feature: Inno Setup Installed"
          Write-Host "========================================="
          while ($true) { Start-Sleep -Seconds 60 }
