name: RDP RE Tools (Firewall OFF + Localhost FIX)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. Install Tailscale
      - name: Install Tailscale
        run: |
          Invoke-WebRequest -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest.exe" -OutFile "$env:TEMP\tailscale-setup.exe"
          Start-Process "$env:TEMP\tailscale-setup.exe" -ArgumentList '/S' -Wait
          Remove-Item "$env:TEMP\tailscale-setup.exe"
          Write-Host "✅ Tailscale installed"

      # 2. Connect Tailscale
      - name: Connect to Tailscale
        env:
          TS_AUTHKEY: ${{ secrets.TAILSCALE_AUTH_KEY }}
        run: |
          & "C:\Program Files\Tailscale\tailscale.exe" up --authkey="$env:TS_AUTHKEY" --accept-routes --accept-dns
          $ip = & "C:\Program Files\Tailscale\tailscale.exe" ip -4
          Write-Host "🌐 Tailscale IPv4: $ip"
          echo "tailscale_ip=$ip" >> $env:GITHUB_OUTPUT
        id: tailscale

      # 3. Enable RDP & MATIKAN FIREWALL (Fix Localhost Issue)
      - name: Enable RDP & Disable Firewall
        run: |
          # Enable RDP
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0
          
          # 🔥 FIX: Matikan Firewall agar port 3000, 8000, dll bisa diakses
          Write-Host "🔥 Mematikan Windows Firewall..."
          Set-NetFirewallProfile -Profile Domain,Public,Private -Enabled False
          
          Write-Host "✅ RDP enabled & Firewall OFF"

      # 4. Set Password
      - name: Set user password
        run: |
          $password = ConvertTo-SecureString -String "P@ssw0rd123!" -AsPlainText -Force
          Set-LocalUser -Name "runneradmin" -Password $password

      # 5. Change Name to richo
      - name: Change computer name to richo
        run: |
          $newName = "richo"
          $env:COMPUTERNAME = $newName
          [Environment]::SetEnvironmentVariable("COMPUTERNAME", $newName, "User")
          [Environment]::SetEnvironmentVariable("COMPUTERNAME", $newName, "Machine")
          $sysPath = "HKLM:\SYSTEM\CurrentControlSet"
          Set-ItemProperty -Path "$sysPath\Control\ComputerName\ActiveComputerName" -Name "ComputerName" -Value $newName -ErrorAction SilentlyContinue
          Set-ItemProperty -Path "$sysPath\Control\ComputerName\ComputerName" -Name "ComputerName" -Value $newName -ErrorAction SilentlyContinue
          Set-ItemProperty -Path "$sysPath\Services\Tcpip\Parameters" -Name "Hostname" -Value $newName -ErrorAction SilentlyContinue

      # 6. Install Tools (Chrome, VS Code, Ghidra, IDA)
      - name: Install Tools
        run: |
          # Chrome
          $Installer = "$env:TEMP\chrome_installer.exe"
          Invoke-WebRequest "http://dl.google.com/chrome/install/375.126/chrome_installer.exe" -OutFile $Installer
          Start-Process $Installer -ArgumentList "/silent", "/install" -Wait
          Remove-Item $Installer
          
          # JDK 21 (For Ghidra)
          winget install Microsoft.OpenJDK.21 --silent --accept-package-agreements --accept-source-agreements
          
          # Ghidra
          winget install NSA.Ghidra --silent --accept-package-agreements --accept-source-agreements
          
          # IDA Free
          winget install Hex-Rays.IDA.Free --silent --accept-package-agreements --accept-source-agreements
          
          # VS Code
          winget install Microsoft.VisualStudioCode --silent --accept-package-agreements --accept-source-agreements
          
          # Python & Go
          winget install Python.Python.3.12 --silent --accept-package-agreements
          winget install GoLang.Go.1.23 --silent --accept-package-agreements
          
          Write-Host "✅ Semua Tools Terinstall!"

      # 7. Info & Keep Alive
      - name: Display connection info
        run: |
          $ip = "${{ steps.tailscale.outputs.tailscale_ip }}"
          Write-Host "========================================="
          Write-Host "🎯 RDP SIAP - FIREWALL SUDAH MATI"
          Write-Host "========================================="
          Write-Host "🖥️ Nama Komputer (Session) : richo"
          Write-Host "🌐 IP Tailscale            : $ip"
          Write-Host "👤 Username                : runneradmin"
          Write-Host "🔑 Password                : P@ssw0rd123!"
          Write-Host ""
          Write-Host "💡 TIPS AKSES LOCALHOST:"
          Write-Host "   1. Jika akses dari HP/Laptop luar: Gunakan http://$ip:PORT"
          Write-Host "   2. Jika akses dari Chrome RDP: Gunakan http://localhost:PORT"
          Write-Host "   3. Pastikan aplikasi run dengan host '0.0.0.0' (jangan 127.0.0.1)"
          Write-Host "========================================="
          while ($true) { Start-Sleep -Seconds 60 }
